name: Crypto Futures Backtest

on:
  push:
    branches: [main]
    paths:
      - crypto_backtest.py
      - .github/workflows/crypto-backtest.yml
  pull_request:
    branches: [main]
    paths:
      - crypto_backtest.py
      - backtest-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Download official Binance data and run backtest
        run: python crypto_backtest.py
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results
          path: results/
          retention-days: 7
