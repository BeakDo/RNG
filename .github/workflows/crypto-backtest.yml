name: Crypto Futures Backtest

on:
  push:
    branches: [main]
    paths:
      - crypto_backtest.py
      - .github/workflows/crypto-backtest.yml
  pull_request:
    branches: [main]
    paths:
      - crypto_backtest.py
      - backtest-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run 5-minute official Binance pilot
        run: |
          python - <<'PY'
          import pandas as pd
          import crypto_backtest as b
          b.SYMBOLS = ["DOGEUSDT", "XRPUSDT", "SOLUSDT", "SUIUSDT", "WIFUSDT", "1000PEPEUSDT", "TRBUSDT"]
          b.TIMEFRAMES = ["5m"]
          b.MONTHS = pd.period_range("2024-07", "2026-06", freq="M").astype(str).tolist()
          b.TRAIN_END = pd.Timestamp("2025-07-01", tz="UTC")
          b.VALID_END = pd.Timestamp("2026-01-01", tz="UTC")
          b.TEST_END = pd.Timestamp("2026-07-01", tz="UTC")
          b.main()
          PY
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results
          path: results/
          retention-days: 7
